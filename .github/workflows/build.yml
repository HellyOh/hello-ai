name: 이미지 빌드하고 올리기

# ① 언제 실행할까: main 브랜치에 push될 때
on:
  push:
    branches: [ main ]

# ② 이 작업이 가진 권한: 패키지(이미지) 쓰기 허용
permissions:
  contents: read
  packages: write

jobs:
  build:
    # ③ 어떤 컴퓨터에서 실행할까: GitHub이 빌려주는 우분투 PC
    runs-on: ubuntu-latest

    steps:
      # ④ 소스 코드 가져오기
      - name: 소스 받기
        uses: actions/checkout@v4

      # ⑤ 창고(GHCR)에 로그인
      - name: 레지스트리 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⑥ AI 상자 만들어서 올리기
      - name: ai 빌드 & 푸시
        run: |
          docker build -t ghcr.io/hellyoh/hello-ai-ai:${{ github.run_number }} ./ai
          docker push ghcr.io/hellyoh/hello-ai-ai:${{ github.run_number }}

      # ⑦ backend 상자
      - name: backend 빌드 & 푸시
        run: |
          docker build -t ghcr.io/hellyoh/hello-ai-backend:${{ github.run_number }} ./backend
          docker push ghcr.io/hellyoh/hello-ai-backend:${{ github.run_number }}

      # ⑧ frontend 상자
      - name: frontend 빌드 & 푸시
        run: |
          docker build -t ghcr.io/hellyoh/hello-ai-frontend:${{ github.run_number }} ./frontend
          docker push ghcr.io/hellyoh/hello-ai-frontend:${{ github.run_number }}