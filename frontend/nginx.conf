server {
  listen 80;                               # 상자 안에서 80번 문으로 손님을 받는다

  location / {                             # 일반 화면 요청은
    root /usr/share/nginx/html;            #   이 폴더의 파일을 직접 준다
    try_files $uri $uri/ /index.html;      #   없는 주소면 index.html을 준다 (React 화면 이동용)
  }

  location /api/ {                         # /api/ 로 시작하는 요청은
    proxy_pass http://backend:8005;        #   "backend" 상자로 안내한다 (이름으로 부르기!)
  }
}